name: Submit news article
description: Use this form to submit a news article to Global Media.
title: "[News]: "
labels: ["news-submission"]
body:
  - type: input
    id: headline
    attributes:
      label: Headline
      description: The heading/title that will appear on the news page
      placeholder: "Enter news heading"
    validations:
      required: true
  - type: input
    id: image_url
    attributes:
      label: Image URL
      description: Paste a public image URL starting with http or https
      placeholder: "https://example.com/news-image.jpg"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Choose a category for the news
      options:
        - Politics
        - Business
        - Entertainment
        - Sports
        - Technology
        - Other
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: Your name or pseudonym as the author
      placeholder: "Enter author name"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: News Description
      description: Write the full news description
      placeholder: "Enter news description"
      value: ""
    validations:
      required: true
