<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Media News Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <h1>Global Media</h1>
  <h2>Your source for community news</h2>
  <nav class="main-nav">
    <a href="submit.html">Submit News</a>
  </nav>
</header>
<main>
  <div id="article-container">
    <!-- Article content will be injected here by JavaScript -->
  </div>
  <div class="navigation">
    <button id="prev-btn" class="nav-button">Previous</button>
    <button id="next-btn" class="nav-button">Next</button>
  </div>
</main>
<footer>
  <p>&copy; <span id="current-year"></span> Global Media</p>
</footer>
<script src="script.js"></script>
<script>
  // Update current year
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
